# Тестовый набор вопросов. Эталонов заказчик не дал - набор собран вручную по тексту четырёх регламентов
# по двум шаблонам из чата задачи: (1) вопрос абстрактно, без контекста; (2) вопрос другими словами, сокращениями,
# по-английски. Вопросы НЕ являются перефразированием пунктов один в один.
#
# expect: answer | clarify | not_found | out_of_scope | off_task | document
# department: подразделение в профиле сотрудника (null - профиль без подразделения)
# clauses: {подразделение: [допустимые пункты]} - ответ засчитывается, если процитирован хотя бы один
# options: подразделения, которые должны быть в кнопках уточнения
# choose: какую кнопку нажать после уточнения (проверяется ответ этого подразделения по clauses)
# missing: ответ должен подсветить отсутствующий документ

