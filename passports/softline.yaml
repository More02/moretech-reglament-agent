  - {canonical: Центр компетенций, aliases: [ЦК]}
  - {canonical: Департамент работы с подрядчиками, aliases: [ДРП, департамент по работе с подрядчиками]}
  - {canonical: Дополнительное соглашение, aliases: [ДС, допсоглашение, доп соглашение]}
  - {canonical: Департамент экономической безопасности, aliases: [ДЭБ]}
