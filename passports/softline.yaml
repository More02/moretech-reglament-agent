# Паспорт компании для агента ответов по регламентам.
# Всё, что относится к конкретной компании, живёт здесь; ядро агента общее для всех компаний.
id: softline
company: Softline
assistant_name: Агент по регламентам

quality_service:
  name: Служба качества
  # Реальный адрес в демо не используется: берётся из переменной окружения QUALITY_EMAIL
  email_env: QUALITY_EMAIL
  # Кто может дать финальный ответ: адреса и домены службы качества
  # + любой участник, которого служба качества сама добавила в переписку
  authorized_senders_env: QUALITY_AUTHORIZED_SENDERS

dialog:
  max_clarifications: 2
  auto_send_escalation: false

# Профили для демонстрации (имитация корпоративного входа; в эксплуатации - из SSO)
demo_profiles:
  - {name: Анна Смирнова, email: employee@example.ru, position: Руководитель проекта, department: dbrct}
  - {name: Игорь Ковалёв, email: employee@example.ru, position: Пресейл-архитектор, department: ib}
  - {name: Мария Орлова, email: employee@example.ru, position: Аккаунт-менеджер, department: null}

# Подразделения (фасет department). aliases - как их называют сотрудники.
departments:
  - id: dbrct
    name: ДБРЦТ
    full_name: Департамент бизнес-решений и цифровой трансформации
    aliases: [ДБРЦТ, ДБР, дирекция бизнес-решений, бизнес-решения, департамент бизнес-решений, цифровая трансформация]
  - id: tech
    name: Техническая дирекция
    full_name: Техническая дирекция
    aliases: [техническая дирекция, техдирекция, тех дирекция, ТД, технический департамент]
  - id: ib
    name: Дирекция ИБ
    full_name: Дирекция информационной безопасности
    aliases: [дирекция ИБ, ДИБ, ИБ, информационная безопасность, УИБ, безопасники]

# Стадии процесса (фасет process)
processes:
  - id: presale
    name: Пресейл
    aliases: [пресейл, пресейла, presale, расчёт, оценка, заявка на пресейл, ТКП]
  - id: project
    name: Проект
    aliases: [проект, реализация, исполнение, внедрение]

# Документы корпуса: имя файла -> метаданные. Даты и владельцев не выдумываем: в выгрузке их нет.
documents:
  - file: Проектная деятельность ДБРЦТ.docx
    id: dbrct-project
    title: Проектная деятельность ДБРЦТ
    department: dbrct
    processes: [presale, project]
    # Разделы 1-6 - пресейл (до КП), 7-23 - проект (инициация и далее)
    sections: {presale: "1-6", project: "7-99"}
  - file: Организация проектной деятельности Тех дирекции.docx
    id: tech-project
    title: Организация проектной деятельности Технической дирекции
    department: tech
    processes: [presale, project]
    # Разделы 1-6 - пресейл (до отправки ТКП), 7-24 - договор и реализация
    sections: {presale: "1-6", project: "7-99"}
  - file: Пресейловая деятельность Дирекции ИБ.docx
    id: ib-presale
    title: Пресейловая деятельность Дирекции ИБ
    department: ib
    processes: [presale]
  - file: Проектная деятельность Дирекции ИБ.docx
    id: ib-project
    title: Проектная деятельность Дирекции ИБ
    department: ib
    processes: [project]

