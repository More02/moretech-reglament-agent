  - {canonical: Аккаунт-менеджер, aliases: [АМ, аккаунт, account manager, аккаунт менеджер]}
  - {canonical: Администратор проекта, aliases: [АП]}
  - {canonical: Менеджер по продаже решений, aliases: [SS, Solution Sales, сейлз, продажник, менеджер по продажам решений]}
  - {canonical: Технический пресейл-специалист, aliases: [TPS, ТПС, технический пресейл, пресейл-специалист]}
  - {canonical: Пресейл-архитектор, aliases: [ПА, архитектор пресейла, presale architect, пресейл архитектор]}
  - {canonical: Ресурс-менеджер, aliases: [РМ, ресурсный менеджер, resource manager, менеджер ресурсов]}
  - {canonical: Расчёт трудозатрат, aliases: [РТЗ, ТЗТ, расчет трудозатрат, оценка трудозатрат, расчёт ТЗТ, трудозатраты]}
