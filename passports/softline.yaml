# Вопросы вне нормативной базы: направляем к адресату, в службу качества не пишем
out_of_scope:
  - topic: Личная премия, зарплата, бонусы, маржа конкретной сделки
    examples: [какую премию я получу, сколько я заработаю на сделке, какая маржа по моей сделке, когда повышение зарплаты]
    redirect: Обратитесь к своему руководителю - эти вопросы не регулируются регламентами проектной и пресейловой деятельности.
  - topic: Отпуск, больничный, кадровые вопросы
    examples: [как оформить отпуск, сколько дней отпуска осталось]
    redirect: Обратитесь в отдел кадров или к своему руководителю.

# Посторонние задачи общего ИИ - не выполняем
off_task_examples:
  - сделай follow-up по встрече
  - какой сегодня курс доллара
  - напиши письмо клиенту
  - переведи текст на английский
