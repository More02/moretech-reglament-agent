[project]
name = "moretech-reglament-agent"
version = "0.1.0"
description = "MORE TECH: ИИ-агент ответов по корпоративным регламентам с цитатами, уточнениями и циклом знаний через службу качества"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "MORE TECH" }]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pymorphy3>=2.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.9",
    "structlog>=24.1",
    "imap-tools>=1.7",
    "aiosmtplib>=3.0",
    "tenacity>=8.5",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
pii = ["natasha>=1.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "pre-commit>=3.8"]

[project.scripts]
reglament = "reglament_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/reglament_agent",
    "libs/reg_parse/src/reg_parse",
    "libs/evidence/src/evidence",
    "libs/ru_text/src/ru_text",
    "libs/pii_guard/src/pii_guard",
    "sdk/src/skill_sdk",
    "skills/query-understand/src/query_understand",
    "skills/answer-compose/src/answer_compose",
    "skills/expert-reply-classify/src/expert_reply_classify",
    "skills/clarification-extract/src/clarification_extract",
    "skills/gap-cluster/src/gap_cluster",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = [
    "src", "sdk/src", "libs/reg_parse/src", "libs/evidence/src", "libs/ru_text/src", "libs/pii_guard/src",
    "skills/query-understand/src", "skills/answer-compose/src", "skills/expert-reply-classify/src",
    "skills/clarification-extract/src", "skills/gap-cluster/src",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C90", "RUF", "SIM", "PTH", "N", "ASYNC"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях - норма для проекта
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PTH", "C90"]
"evals/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "src:sdk/src:libs/reg_parse/src:libs/evidence/src:libs/ru_text/src:libs/pii_guard/src:skills/query-understand/src:skills/answer-compose/src:skills/expert-reply-classify/src:skills/clarification-extract/src:skills/gap-cluster/src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pymorphy3.*", "natasha.*", "docx.*", "rank_bm25.*", "sentence_transformers.*", "pgvector.*", "imap_tools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "libs", "skills", "sdk"]
pythonpath = [
    "src", "sdk/src", "libs/reg_parse/src", "libs/evidence/src", "libs/ru_text/src", "libs/pii_guard/src",
    "skills/query-understand/src", "skills/answer-compose/src", "skills/expert-reply-classify/src",
    "skills/clarification-extract/src", "skills/gap-cluster/src",
]
asyncio_mode = "auto"
