# Сервер, где 80/443 уже занимает Caddy другого продукта (общий сервер MORE TECH).
# Свой Caddy не запускаем. Приложение НЕ подключается к сети чужого продукта через compose:
# compose добавил бы псевдоним «app», и Caddy того продукта стал бы отдавать наш сайт на своих доменах.
# После запуска подключаем контейнер вручную, только под именем reglament-app:
#   docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.shared-proxy.yml up -d --build
#   docker network connect --alias reglament-app "$PROXY_NETWORK" reglament-agent-app-1
# Сайт описывается файлом deploy/reglament.caddy в каталоге сайтов того Caddy.
services:
  caddy:
    profiles: [own-proxy]
